volumes:
  database-data:
    external: true
    name: calcom_database-data
  redis-data:
    external: true
    name: calcom_redis-data

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: calcom-db
    image: postgres:16
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - stack

  redis:
    container_name: calcom-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - stack

  calcom:
    container_name: calcom
    image: ghcr.io/gimelg/calcom-custom:polls-v3
    restart: unless-stopped
    depends_on:
      - database
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "18821:3000"
    networks:
      - stack
