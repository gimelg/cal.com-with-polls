volumes:
  database-data:
    external: true
    name: calcom_database-data
  redis-data:
    external: true
    name: calcom_redis-data

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: calcom-db
    image: postgres:16
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - stack

  redis:
    container_name: calcom-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - stack

  calcom-migrate:
    container_name: calcom-migrate
    image: ghcr.io/gimelg/calcom-custom:polls-v2-init
    restart: "no"
    depends_on:
      - database
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_URL}
    command:
      - sh
      - -c
      - scripts/wait-for-it.sh ${DATABASE_HOST} -- npx prisma migrate deploy --schema /calcom/packages/prisma/schema.prisma
    networks:
      - stack

  calcom-seed:
    container_name: calcom-seed
    image: ghcr.io/gimelg/calcom-custom:polls-v2-init
    restart: "no"
    profiles:
      - seed
    depends_on:
      calcom-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_URL}
    command:
      - npx
      - ts-node
      - --transpile-only
      - /calcom/scripts/seed-app-store.ts
    networks:
      - stack

  calcom:
    container_name: calcom
    image: ghcr.io/gimelg/calcom-custom:polls-v2
    restart: unless-stopped
    depends_on:
      calcom-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "18821:3000"
    networks:
      - stack
